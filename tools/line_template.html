<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ – Carlsen with White</title>
<style>
:root{
  --fs:21px;
  --paper:#fbfaf7; --ink:#1d1f22; --muted:#5d6670; --line:#e2e0da; --side:#f2f0eb;
  --main:#1f4fa3; --var:#2b2f36; --hl:#ffe08a; --hlink:#e8eefb;
  --light:#dee3e6; --dark:#8ca2ad; --lm:rgba(155,199,0,.45);
  --btn:#ffffff; --btnb:#cfd5db; --win:#2f6b3a; --loss:#a33a2a;
}
:root[data-theme="dark"]{
  --paper:#16191d; --ink:#e4e6e9; --muted:#9aa3ad; --line:#2c3238; --side:#1d2126;
  --main:#86b4ff; --var:#d5d9de; --hl:#6b5a1e; --hlink:#25324a;
  --btn:#232930; --btnb:#3a434c; --win:#7fcf93; --loss:#f08a7a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--fs);line-height:1.6}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--side);border-bottom:1px solid var(--line);font-family:system-ui,"Segoe UI",sans-serif;font-size:15px}
.top a.lib{color:var(--main);text-decoration:none;font-weight:600;white-space:nowrap}
.top .t{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select,input{font:inherit;font-family:system-ui,"Segoe UI",sans-serif;background:var(--btn);color:var(--ink);border:1px solid var(--btnb);border-radius:7px;padding:6px 12px}
button{cursor:pointer;min-width:40px}
button:hover{border-color:var(--main)}
button:disabled{opacity:.35;cursor:default}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr) auto;align-items:start}
nav.toc{position:sticky;top:49px;height:calc(100vh - 49px);overflow:auto;padding:18px 12px;border-right:1px solid var(--line);background:var(--side);font-family:system-ui,"Segoe UI",sans-serif;font-size:14px}
nav.toc .h{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.06em;margin-bottom:8px}
nav.toc a{display:block;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.toc a:hover,nav.toc a.on{background:var(--hlink);color:var(--main)}
nav.toc a .r{color:var(--muted);font-size:12px}
main{padding:28px 40px 120px;max-width:44em;margin:0 auto;width:100%}
aside.bp{position:sticky;top:49px;padding:16px 20px;border-left:1px solid var(--line);height:calc(100vh - 49px);overflow:auto;width:calc(var(--bw) + 70px)}
:root{--bw:min(44vw, calc(100vh - 290px), 680px)}
.kicker{font-family:system-ui,"Segoe UI",sans-serif;font-size:.7em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
h1{font-family:system-ui,"Segoe UI",sans-serif;font-size:2.3em;line-height:1.1;margin:.2em 0 .15em}
.dek{color:var(--main);font-size:1.15em;margin:.2em 0}
.stats{font-family:system-ui,"Segoe UI",sans-serif;font-size:.78em;color:var(--muted);margin:.5em 0 1em}
.stats b{color:var(--ink)}
h2{font-family:system-ui,"Segoe UI",sans-serif;font-size:1.25em;margin:1.8em 0 .3em;padding-top:.5em;border-top:2px solid var(--line);cursor:pointer}
h2:hover{color:var(--main)}
p{margin:.65em 0}
.gamehead{font-size:.88em;line-height:1.5;margin:.15em 0;color:var(--muted)}
.gamehead b{color:var(--ink)}
.opn{font-family:system-ui,"Segoe UI",sans-serif;font-size:.72em;font-weight:600;color:var(--muted);margin:.3em 0 0}
a.mv{cursor:pointer;border-radius:4px;padding:0 2px;color:var(--var);text-decoration:none}
a.mv:hover{background:var(--hlink)}
a.mv.cur{background:var(--hl)}
p.ml{font-weight:700;font-size:1.08em;margin:.7em 0 .3em}
p.ml a.mv{color:var(--main)}
.res{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;font-size:.85em;color:var(--muted)}
.tree{display:block;margin:.8em 0 .3em}
.tree img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;object-position:top;border-radius:10px;box-shadow:0 0 0 5px #3b2416;background:#fff}
.tree span{font-family:system-ui,"Segoe UI",sans-serif;font-size:.7em;color:var(--main);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:.8em 0 .4em;font-family:system-ui,"Segoe UI",sans-serif;font-size:15px}
.tools input{flex:1;min-width:12em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:.6em 0;font-family:system-ui,"Segoe UI",sans-serif;font-size:14px}
.chips button{border-radius:999px;padding:4px 12px}
.chips button.on{background:var(--main);border-color:var(--main);color:#fff}
.chips small{opacity:.7}
.more{display:block;margin:2em auto;font-size:16px;padding:10px 22px}
.empty{color:var(--muted);font-style:italic}
/* board */
.bwrap{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;width:max-content}
.bd{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;border:2px solid #5b6f79;user-select:none}
.sq{position:relative}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq.lm::after{content:"";position:absolute;inset:0;background:var(--lm)}
.pc{position:absolute;inset:0;background-size:100% 100%;z-index:1}
.rk{display:grid;grid-template-rows:repeat(8,minmax(0,1fr));line-height:1;font-family:system-ui,sans-serif;color:var(--muted);text-align:center;padding-right:5px}
.fl{grid-column:2;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));line-height:1.4;font-family:system-ui,sans-serif;color:var(--muted);text-align:center}
.rk span{display:flex;align-items:center}
#live .bd{width:var(--bw)} #live .rk,#live .fl{font-size:14px}
.bhead{font-family:system-ui,"Segoe UI",sans-serif;font-size:15px;color:var(--muted);margin-bottom:8px;min-height:1.4em;display:flex;justify-content:space-between;gap:10px}
.bhead b{color:var(--ink);font-size:17px;white-space:nowrap}
.ctrls{display:flex;gap:6px;margin:12px 0 0 22px;flex-wrap:wrap}
.ctrls button{font-size:18px;padding:5px 12px}
.gnav{display:flex;gap:6px;margin:8px 0 0 22px;font-size:14px}
.gnav button{font-size:14px;padding:4px 10px}
.msg{margin:8px 0 0 22px;font-family:system-ui,"Segoe UI",sans-serif;font-size:14px;color:var(--muted)}
.tog{display:none}
@media (max-width:1100px){
  .top{height:49px;padding:0 10px;gap:6px}
  .top button{padding:5px 9px;min-width:0}
  .tog{display:inline-block}
  .wrap{grid-template-columns:1fr}
  nav.toc{display:none}
  aside.bp{order:-1;position:sticky;top:49px;z-index:10;height:auto;width:auto;border-left:0;border-bottom:1px solid var(--line);background:var(--paper);padding:8px 12px 10px}
  :root{--bw:min(calc(100vw - 56px), 38vh, 560px);--bw:min(calc(100vw - 56px), 38svh, 560px)}
  .bhead{font-size:13px;margin-bottom:4px;align-items:baseline}
  .bhead #who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .bhead b{font-size:15px}
  #live{display:flex;justify-content:center}
  #live .rk,#live .fl{font-size:11px}
  .ctrls,.gnav,.msg{margin-left:0;justify-content:center;text-align:center}
  .ctrls{margin-top:8px}
  .ctrls button{font-size:17px;padding:4px 0;flex:1;max-width:64px}
  .gnav{margin-top:4px}
  .msg{margin-top:4px;font-size:12px}
  main{padding:16px 16px 80px}
  body.hideb #live,body.hideb .bhead,body.hideb .gnav{display:none}
}
@media (max-width:480px){ .top .t{display:none} .top a.lib{flex:1} }
</style>
<style>__PIECES__</style>
</head>
<body>
<div class="top">
  <a class="lib" href="__BACKHREF__" title="Back to the repertoire">&larr; __BACKTXT__</a>
  <span class="t">__TITLE__ — Carlsen with White</span>
  <button id="fminus" title="Smaller text">A−</button>
  <button id="fplus" title="Larger text">A+</button>
  <button id="dark" title="Dark mode">Dark</button>
  <button id="bTog" class="tog" title="Show or hide the board">Hide board</button>
</div>
<div class="wrap">
  <nav class="toc">
    <div class="h">Games <span id="tocn"></span></div>
    <div id="toc"></div>
  </nav>
  <main>
    <div class="kicker">__KICKER__</div>
    <h1>__TITLE__</h1>
    <div class="dek">__DEK__</div>
    <div class="stats" id="stats"></div>
__TREE__
    <div class="chips" id="chips"></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search opponent, event, year, opening…" aria-label="Search games">
      <select id="sort" aria-label="Sort games">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="elo">Strongest opponent first</option>
        <option value="long">Longest games first</option>
      </select>
    </div>
    <p class="stats">Click any move to see the position on the board. Use ← → to step through a game, Home / End to jump, [ and ] for the previous or next game, F to flip the board.</p>
    <div id="games"></div>
    <button class="more" id="more" hidden>Show more games</button>
  </main>
  <aside class="bp">
    <div class="bhead"><span id="who"></span><b id="cur"></b></div>
    <div id="live"></div>
    <div class="ctrls">
      <button id="bStart" title="Start (Home)">⏮</button>
      <button id="bPrev" title="Back (←)">◀</button>
      <button id="bNext" title="Forward (→)">▶</button>
      <button id="bEnd" title="End of game (End)">⏭</button>
      <button id="bFlip" title="Flip board (F)">⇅</button>
    </div>
    <div class="gnav"><button id="gPrev" title="Previous game ([)">◀ game</button><button id="gNext" title="Next game (])">game ▶</button></div>
    <div class="msg" id="msg"></div>
  </aside>
</div>
<script>__CHESSJS__</script>
<script>
const DATA = __DATA__;
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k){try{return localStorage.getItem('cw_'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('cw_'+k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const files='abcdefgh';
const G=DATA.games.map((r,i)=>({i,date:r[0],event:r[1],site:r[2],round:r[3],black:r[4],welo:r[5],belo:r[6],res:r[7],eco:r[8],opn:r[9],moves:r[10].split(' '),fam:r[11]||''}));
const last=n=>n.split(',')[0].trim();
const short=n=>{const p=n.split(',');return p.length>1?p[0].trim()+', '+p[1].trim()[0]:n};
const yr=g=>g.date.slice(0,4).replace(/\?/g,'');
let view=[], shown=0, fam='', q='', sortk='new', cur={k:null,p:0}, flipped=store.get('flip')==='1';
const PAGE=25;
let hashOK=false; addEventListener('load',()=>{hashOK=true});

/* ---------- list, filter, sort ---------- */
function applyFilter(){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  view=G.filter(g=>{
    if(fam&&g.fam!==fam) return false;
    if(!terms.length) return true;
    const hay=(g.black+' '+g.event+' '+g.site+' '+g.date+' '+g.opn+' '+g.eco+' '+g.res).toLowerCase();
    return terms.every(t=>hay.includes(t));
  });
  const num=v=>parseInt(v)||0;
  const cmp={new:(a,b)=>b.date.localeCompare(a.date)||b.i-a.i, old:(a,b)=>a.date.localeCompare(b.date)||a.i-b.i,
    elo:(a,b)=>num(b.belo)-num(a.belo), long:(a,b)=>b.moves.length-a.moves.length}[sortk];
  view.sort(cmp);
  shown=0; $('#games').innerHTML=''; renderMore(); renderToc(); renderStats();
}
function renderStats(){
  let w=0,d=0,l=0; view.forEach(g=>{if(g.res==='1-0')w++;else if(g.res==='0-1')l++;else d++});
  const n=view.length, sc=n?Math.round((w+d/2)/n*100):0;
  $('#stats').innerHTML=n?`<b>${n}</b> game${n==1?'':'s'} · Carlsen <b>+${w} =${d} −${l}</b> · score <b>${sc}%</b>`:'';
}
function renderToc(){
  $('#tocn').textContent='('+view.length+')';
  $('#toc').innerHTML=view.map(g=>`<a data-k="${g.i}" title="${esc(g.event)} ${esc(g.date)}">${yr(g)} · ${esc(last(g.black))} <span class="r">${g.res.replace('1/2-1/2','½')}</span></a>`).join('');
  markToc();
}
function markToc(){ $$('#toc a').forEach(a=>a.classList.toggle('on',cur.k!==null&&+a.dataset.k===cur.k)); const on=$('#toc a.on'), box=$('nav.toc'); if(on&&box.offsetParent!==null){ const t=on.offsetTop, h=box.clientHeight; if(t<box.scrollTop+30||t>box.scrollTop+h-60) box.scrollTop=Math.max(0,t-h/2) } }
function movesHTML(g){
  return g.moves.map((s,i)=>`<a class="mv" data-k="${g.i}" data-p="${i+1}">${i%2?'':(i/2+1)+'.'}${esc(s)}</a>`).join(' ');
}
function blockHTML(g){
  const ev=[g.event,g.site&&g.site!=='?'?g.site:''].filter(Boolean).join(', ');
  const rd=g.round&&g.round!=='?'&&g.round!=='-'?' · rd '+esc(g.round):'';
  return `<section class="game" id="g${g.i}" data-k="${g.i}">
  <h2 data-k="${g.i}">Carlsen – ${esc(last(g.black))}</h2>
  <div class="gamehead"><b>Carlsen, M</b>${g.welo?' ('+esc(g.welo)+')':''} – <b>${esc(short(g.black))}</b>${g.belo?' ('+esc(g.belo)+')':''}</div>
  <div class="gamehead">${esc(ev)} · ${esc(g.date.replace(/\.\?\?/g,''))}${rd} · ${esc(g.res)}</div>
  ${g.opn?`<div class="opn">${esc(g.eco)} · ${esc(g.opn)}</div>`:''}
  <p class="ml">${movesHTML(g)} <span class="res">${esc(g.res)}</span></p>
</section>`;
}
function renderMore(){
  const next=view.slice(shown,shown+PAGE);
  $('#games').insertAdjacentHTML('beforeend',next.map(blockHTML).join(''));
  shown+=next.length;
  $('#more').hidden=shown>=view.length;
  $('#more').textContent='Show more games ('+(view.length-shown)+' left)';
  if(!view.length) $('#games').innerHTML='<p class="empty">No games match.</p>';
  paintCur();
}
function ensureShown(k){ let idx=view.findIndex(g=>g.i===k); if(idx<0) return false; while(shown<=idx) renderMore(); return true }

/* ---------- board ---------- */
function boardHTML(fen,lm){
  const rows=fen.split(' ')[0].split('/'); const grid=[];
  rows.forEach((r,ri)=>{let c=0;for(const ch of r){if(/\d/.test(ch))c+=+ch;else{grid[ri*8+c]=ch;c++}}});
  let sq='';
  for(let i=0;i<64;i++){
    const r=flipped?7-Math.floor(i/8):Math.floor(i/8), c=flipped?7-i%8:i%8;
    const name=files[c]+(8-r), p=grid[r*8+c];
    sq+=`<div class="sq ${(r+c)%2?'d':'l'}${lm.includes(name)?' lm':''}">${p?`<div class="pc ${p===p.toUpperCase()?'w':'b'}${p.toUpperCase()}"></div>`:''}</div>`;
  }
  const rk=[...Array(8)].map((_,i)=>`<span>${flipped?i+1:8-i}</span>`).join('');
  const fs=[...Array(8)].map((_,i)=>`<span>${files[flipped?7-i:i]}</span>`).join('');
  return `<div class="bwrap"><div class="rk">${rk}</div><div class="bd">${sq}</div><div class="fl">${fs}</div></div>`;
}
function render(){
  const g=cur.k===null?null:G[cur.k];
  const c=new Chess(); let lastMv=null;
  if(g) for(let i=0;i<cur.p;i++) lastMv=c.move(g.moves[i],{sloppy:true});
  $('#live').innerHTML=boardHTML(c.fen(),lastMv?[lastMv.from,lastMv.to]:[]);
  if(!g){ $('#who').textContent='Pick a game'; $('#cur').textContent=''; return }
  $('#who').textContent='Carlsen – '+last(g.black)+' · '+yr(g);
  const lab=cur.p===0?'Start':(cur.p%2?((cur.p+1)/2)+'.':(cur.p/2)+'...')+g.moves[cur.p-1];
  $('#cur').textContent=lab;
  let m=c.in_checkmate()?'Checkmate.':c.in_stalemate()?'Stalemate.':'';
  if(!m&&cur.p===g.moves.length) m='End of game · '+g.res.replace('1/2-1/2','draw');
  $('#msg').textContent=m||((c.turn()==='w'?'White':'Black')+' to move');
  $('#bPrev').disabled=$('#bStart').disabled=cur.p===0;
  $('#bNext').disabled=$('#bEnd').disabled=cur.p>=g.moves.length;
  const gi=view.findIndex(x=>x.i===cur.k);
  $('#gPrev').disabled=gi<=0; $('#gNext').disabled=gi<0||gi>=view.length-1;
}
function paintCur(){
  $$('main a.mv.cur').forEach(a=>a.classList.remove('cur'));
  if(cur.k===null||cur.p===0) return null;
  const a=document.querySelector(`main a.mv[data-k="${cur.k}"][data-p="${cur.p}"]`);
  if(a) a.classList.add('cur');
  return a;
}
function go(k,p,fromText){
  cur={k,p}; render(); markToc();
  const a=paintCur();
  if(a&&!fromText){const r=a.getBoundingClientRect(), bp=document.querySelector('aside.bp').getBoundingClientRect(), pb=(bp.width>innerWidth*0.9)?bp.bottom:80;
    if(r.top<pb+8||r.bottom>innerHeight-20) scrollBy({top:r.top-(pb+innerHeight)/2+r.height/2,behavior:'smooth'})}
  if(hashOK){try{history.replaceState(null,'','#g'+k)}catch(e){}}
}
function gotoGame(k,scroll){
  if(!ensureShown(k)) return;
  go(k,0,true);
  if(scroll){const el=document.getElementById('g'+k); if(el){const bp=document.querySelector('aside.bp').getBoundingClientRect(); const off=(bp.width>innerWidth*0.9)?bp.bottom+10:70; scrollTo({top:el.getBoundingClientRect().top+scrollY-off,behavior:'smooth'})}}
}
const L=()=>cur.k===null?0:G[cur.k].moves.length;
const next=()=>{if(cur.k!==null&&cur.p<L())go(cur.k,cur.p+1)};
const prev=()=>{if(cur.k!==null&&cur.p>0)go(cur.k,cur.p-1)};
const start=()=>{if(cur.k!==null)go(cur.k,0)};
const end=()=>{if(cur.k!==null)go(cur.k,L())};
function gstep(d){const gi=view.findIndex(x=>x.i===cur.k); const n=view[gi+d]; if(n) gotoGame(n.i,true)}
const flip=()=>{flipped=!flipped;store.set('flip',flipped?'1':'0');render()};
$('#bNext').onclick=next;$('#bPrev').onclick=prev;$('#bStart').onclick=start;$('#bEnd').onclick=end;$('#bFlip').onclick=flip;
$('#gPrev').onclick=()=>gstep(-1);$('#gNext').onclick=()=>gstep(1);
$('#more').onclick=renderMore;
document.addEventListener('click',e=>{
  const a=e.target.closest('a.mv'); if(a){go(+a.dataset.k,+a.dataset.p,true);return}
  const h=e.target.closest('h2[data-k]'); if(h){go(+h.dataset.k,0,true);return}
  const t=e.target.closest('#toc a'); if(t){gotoGame(+t.dataset.k,true)}
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  const k=e.key;
  if(k==='ArrowRight'){next();e.preventDefault()}else if(k==='ArrowLeft'){prev();e.preventDefault()}
  else if(k==='Home'){start();e.preventDefault()}else if(k==='End'){end();e.preventDefault()}
  else if(k==='['){gstep(-1)}else if(k===']'){gstep(1)}
  else if(k==='f'||k==='F')flip();
});
/* chips: opening names in this line; each one also swaps the tree above the games */
(function(){
  const el=$('#chips'), top=DATA.chips||[];
  const link=$('#treeLink'), img=$('#treeImg'), cap=$('#treeCap'), note=$('#treeNote');
  const base=link?{href:link.getAttribute('href'),src:img.getAttribute('src'),cap:cap.textContent}:null;
  function setTree(f){
    if(!base) return;
    const t=f&&DATA.trees&&DATA.trees[f];
    if(t){
      link.setAttribute('href','../../trees/'+t.slug+'/'); img.setAttribute('src','../../trees/'+t.slug+'/preview.jpg');
      img.alt='Opening tree for '+f; cap.textContent='Open the zoomable tree for '+f+' \u2192';
      note.innerHTML='Tree of the <b>'+t.n+'</b> '+esc(f)+' games. They all start <b>'+esc(t.moves)+'</b> and differ after that.';
    } else {
      link.setAttribute('href',base.href); img.setAttribute('src',base.src); img.alt='Opening tree'; cap.textContent=base.cap;
      note.textContent=f?'No separate tree for '+f+' (too few games).':'';
    }
  }
  if(top.length<2){el.remove();return}
  const draw=()=>{el.innerHTML=`<button class="${fam?'':'on'}" data-f="">All <small>${G.length}</small></button>`+top.map(([f,n])=>`<button class="${fam===f?'on':''}" data-f="${esc(f)}">${esc(f)} <small>${n}</small></button>`).join('')};
  el.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; fam=b.dataset.f; draw(); setTree(fam); applyFilter()});
  draw();
})();
$('#q').addEventListener('input',e=>{q=e.target.value; applyFilter()});
$('#sort').addEventListener('change',e=>{sortk=e.target.value; applyFilter()});
/* text size & dark mode */
let fs=+store.get('fs')||21;
const setFs=v=>{fs=Math.max(15,Math.min(34,v));document.documentElement.style.setProperty('--fs',fs+'px');store.set('fs',fs)};
$('#fplus').onclick=()=>setFs(fs+2);$('#fminus').onclick=()=>setFs(fs-2);setFs(fs);
const setDark=d=>{document.documentElement.dataset.theme=d?'dark':'light';$('#dark').textContent=d?'Light':'Dark';store.set('dark',d?'1':'0')};
let dk=store.get('dark')==='1';setDark(dk);$('#dark').onclick=()=>{dk=!dk;setDark(dk)};
(function(){var b=$('#bTog');b.onclick=function(){var h=document.body.classList.toggle('hideb');b.textContent=h?'Show board':'Hide board'}})();
/* go */
applyFilter();
const hash=location.hash.match(/^#g(\d+)$/);
if(hash&&G[+hash[1]]){ gotoGame(+hash[1],true) } else if(view.length){ go(view[0].i,0,true) } else render();
})();
</script>
</body>
