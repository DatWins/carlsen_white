<style>
/* Carlsen with White palette: the blue-grey board of the game viewer
   navy #1f2a33 · light #dee3e6 · board blue #8ca2ad · accent blue #1f4fa3 */
:root {
    --cover-text-color:#dee3e6;
    --cover-title-and-description-guard-bg-color: rgba(18,26,33,.72);
    --cover-title-text-shadow: none;

    --highlight:#dee3e6;
    --highlight-contrast:#1f2a33;
    --highlight-inverse:#1f4fa3;
    --highlight-inverse-contrast:#dee3e6;

    --sticky-menu-text-color:#8ca2ad;

    --section-light-bg-color:#dee3e6;
    --section-light-text-color:#1f2a33;
    --section-dark-bg-color:#1f2a33!important;
    --section-dark-text-color:#dee3e6!important;
    --section-uni-quote:#5b6f79;
    --section-uni-code-bg-color:#c5ced4;

    --footer-color-background:#161d23;
    --footer-color:#a9b8c2;

     --ul-li-icon: ;
}
.blog-title, .blog-description { color:#dee3e6 !important; }
.title-and-description-guard { border:1px solid rgba(140,162,173,.55); }
#site-head .btn.site-menu { border:none; }
.post-content a { text-decoration-color:#8ca2ad; text-underline-offset:3px; }
.post-content a:hover { color:#1f4fa3; }
.post-holder.dark .post-content a:hover { color:#a9c4f5; }
.fixed-nav a.fn-item.active { color:#1f4fa3; }
/* chess site: smaller project headings with space above them */
.post-content h2 { font-size: 1.45em; margin-top: 1.6em; }
.post-title { margin-bottom: 0.4em; }

/* ---------- phones & tablets ---------- */
@media only screen and (max-width: 1130px) {
  /* sticky menu: one row of large, easy-to-tap buttons that scrolls sideways */
  .fixed-nav {
    flex-wrap: nowrap !important; justify-content: flex-start; align-items: center; gap: 6px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: 8px 10px !important; background: #1f2a33 !important; box-shadow: 0 2px 8px rgba(0,0,0,.25);
    box-sizing: border-box;
  }
  .fixed-nav::-webkit-scrollbar { display: none; }
  a.fn-item {
    display: inline-block !important; flex: 0 0 auto; margin: 0 !important;
    padding: 9px 14px; border-radius: 999px; white-space: nowrap;
    font-size: 15px; line-height: 1.2; letter-spacing: .02em;
    color: #dee3e6 !important; background: rgba(222,227,230,.12); opacity: .9;
  }
  a.fn-item.active { background: #dee3e6; color: #1f2a33 !important; opacity: 1; }
  .post-holder .post { scroll-margin-top: 64px; }

  /* cover: menu buttons big enough for a thumb */
  #site-head .btn.site-menu { padding: 10px 16px; margin: 5px 3px; font-size: 15px; }
  #site-head .blog-title { font-size: 3.4rem; }
  #site-head .blog-description { font-size: 1.9rem; }

  /* links in the sections become proper tap targets */
  .post-content ul { padding-left: 0; list-style: none; }
  .post-content li { margin: .6em 0; }
  .post-content li a {
    display: inline-block; padding: 9px 16px; margin: 3px 6px 3px 0;
    border: 1.5px solid currentColor; border-radius: 10px; text-decoration: none; line-height: 1.3;
  }
  .post-content h2 { font-size: 1.3em; overflow-wrap: anywhere; }
  .post-content { overflow-wrap: break-word; }
}

</style>
<script>
/* keep the highlighted menu button visible in the sideways-scrolling phone menu */
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('.fixed-nav'); if (!nav) return; var last = null;
  window.addEventListener('scroll', function () {
    var a = nav.querySelector('.fn-item.active'); if (!a || a === last || nav.scrollWidth <= nav.clientWidth) return; last = a;
    nav.scrollTo({ left: a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: 'smooth' });
  }, { passive: true });
});
</script>

<style>
/* opening trees: preview picture that opens the zoomable tree */
.post-content p > a > img { display:block; width:100%; max-width:900px; height:auto; margin:.6em 0 .2em;
  border-radius:10px; box-shadow:0 0 0 6px #1f2a33, 0 6px 22px rgba(31,42,51,.35); background:#fff; }
.post-content p > a:hover > img { box-shadow:0 0 0 6px #1f4fa3, 0 6px 22px rgba(31,42,51,.35); }
.post-content p > a:focus-visible > img { outline:3px solid #1f4fa3; outline-offset:8px; }
</style>
<style>
/* keep chess notation as written (1.e4, 1.Nf3) instead of ALL CAPS */
#site-head .btn.site-menu, .fixed-nav a.fn-item { text-transform:none !important; letter-spacing:.02em; }
#site-head .btn.site-menu { font-size:1.05em; }
</style>
<style>
/* line cards: one card per line, with a win/draw/loss bar */
.linecards { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:16px; margin:1em 0 2em; }
.post-content a.linecard { display:flex; flex-direction:column; gap:6px; padding:14px 16px; border-radius:12px; text-decoration:none;
  background:#dee3e6; color:#1f2a33; border:2px solid #1f2a33; transition:transform .15s ease, box-shadow .15s ease; }
.post-holder.dark a.linecard { background:#2a3844; color:#dee3e6; border-color:#8ca2ad; }
.post-content a.linecard:hover, .post-content a.linecard:focus-visible { transform:translateY(-2px); box-shadow:0 6px 18px rgba(31,42,51,.35); border-color:#1f4fa3; outline:none; }
.linecard .lc-title { font-size:1.35em; font-weight:700; line-height:1.2; }
.linecard .lc-names { font-size:.82em; opacity:.8; line-height:1.35; min-height:2.7em; }
.linecard .lc-bar { display:flex; height:10px; border-radius:5px; overflow:hidden; background:#8ca2ad; }
.linecard .lc-bar i { display:block; }
.linecard .lc-bar .w { background:#2f7d4a; } .linecard .lc-bar .d { background:#aab6bd; } .linecard .lc-bar .l { background:#b24a3a; }
.linecard .lc-meta { font-size:.8em; opacity:.9; }
.post-content ul { list-style:none; padding-left:0; }
.post-content li { margin:.45em 0; }
@media only screen and (max-width: 640px) { .linecards { grid-template-columns:1fr; } }
</style>
